name: release

# Tag a version (git tag v0.2.0 && git push origin v0.2.0) to publish every skill
# as a zip that can be uploaded to claude.ai or Claude Desktop.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  skill-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill (folder with SKILL.md inside)
        run: |
          mkdir -p dist
          for skill in plugins/*/skills/*/; do
            name=$(basename "$skill")
            (cd "$(dirname "$skill")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
